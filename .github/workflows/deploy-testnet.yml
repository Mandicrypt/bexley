name: Deploy to NEAR testnet

# Run by hand from the Actions tab: "Deploy to NEAR testnet" -> "Run workflow".
# Each contract lives on a sub-account of bexley.testnet. Running it again
# later only updates the code; it never wipes existing data.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: true
        default: everything
        type: choice
        options:
          - everything
          - tnear
          - core
          - retire-usdc

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEAR_ACCOUNT_ID: bexley.testnet
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
      TNEAR_ID: tnear.bexley.testnet
      APP_ID: app.bexley.testnet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deploy scripts
        working-directory: scripts
        run: npm ci
      - name: Check the secret is set
        run: |
          if [ -z "$NEAR_PRIVATE_KEY" ]; then
            echo "::error::The NEAR_PRIVATE_KEY secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # The first design used a test USDC token. Deals are now held in tNEAR,
      # so the USDC account is retired and its NEAR returned to the owner.
      - name: Retire test USDC
        if: inputs.target == 'everything' || inputs.target == 'retire-usdc'
        run: node scripts/retire.mjs usdc

      - name: Build and deploy tNEAR (test NEAR faucet token)
        if: inputs.target == 'everything' || inputs.target == 'tnear'
        run: |
          (cd contracts/faucet-token && cargo near build non-reproducible-wasm)
          WASM=$(find target/near -name 'faucet_token.wasm' | head -1)
          node scripts/deploy.mjs tnear "$WASM" new \
            '{"name":"Bexley Test NEAR","symbol":"tNEAR","decimals":24,"faucet_amount":"100000000000000000000000000"}'

      - name: Build and deploy Bexley core
        if: inputs.target == 'everything' || inputs.target == 'core'
        run: |
          (cd contracts/bexley && cargo near build non-reproducible-wasm)
          WASM=$(find target/near -name 'bexley.wasm' | head -1)
          # Deal lengths: 10 min, 1 hour, 1 day, 7 days, 14 days, 30 days.
          INIT=$(jq -nc --arg asset "$TNEAR_ID" --arg owner "$NEAR_ACCOUNT_ID" \
            '{asset:$asset, asset_decimals:24, agent:$owner, price_feeder:$owner, fee_bps:1000,
              min_deposit:"100000000000000000000000", durations:[600,3600,86400,604800,1209600,2592000]}')
          echo "Init: $INIT"
          node scripts/deploy.mjs app "$WASM" new "$INIT"
          # Let the core contract hold tNEAR.
          node scripts/call.mjs "$TNEAR_ID" register "{\"account_id\":\"$APP_ID\"}"
