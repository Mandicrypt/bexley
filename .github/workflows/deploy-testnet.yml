name: Deploy to NEAR testnet

# Run by hand from the Actions tab: "Deploy to NEAR testnet" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      contract:
        description: Which contract to deploy
        required: true
        default: test-usdc
        type: choice
        options:
          - test-usdc

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEAR_ACCOUNT_ID: bexley.testnet
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deploy script
        working-directory: scripts
        run: npm ci
      - name: Check the secret is set
        run: |
          if [ -z "$NEAR_PRIVATE_KEY" ]; then
            echo "::error::The NEAR_PRIVATE_KEY secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build and deploy test USDC
        if: inputs.contract == 'test-usdc'
        run: |
          (cd contracts/test-usdc && cargo near build non-reproducible-wasm)
          WASM=$(find target/near -name 'test_usdc.wasm' | head -1)
          echo "Built: $WASM"
          node scripts/deploy.mjs usdc "$WASM" new '{}' 3
