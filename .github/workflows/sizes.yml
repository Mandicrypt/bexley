name: Contract sizes
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - run: |
          (cd contracts/bexley && cargo near build non-reproducible-wasm >/dev/null 2>&1)
          (cd contracts/xtoken && cargo near build non-reproducible-wasm >/dev/null 2>&1)
          find target/near -name '*.wasm' -exec ls -la {} \;
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd scripts && npm ci >/dev/null
          node -e "
          import('near-api-js').then(async ({JsonRpcProvider}) => {
            const p = new JsonRpcProvider({url:'https://test.rpc.fastnear.com'});
            for (const a of ['pool.bexley.testnet','xnear.bexley.testnet','guardian.bexley.testnet']) {
              const v = await p.viewAccount({accountId:a});
              console.log('SIZE', a, 'storage bytes', v.storage_usage, '=> NEAR locked', (v.storage_usage/1e5).toFixed(2));
            }
          })"
