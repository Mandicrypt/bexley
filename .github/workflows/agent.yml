name: Bexley Pool Guardian

# The agent runs on its own every 15 minutes (GitHub may start it a few
# minutes late), and can be run by hand from the Actions tab.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        required: true
        default: tick
        type: choice
        options:
          - tick
          - dry-run
          - setup

concurrency:
  group: bexley-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEAR_ACCOUNT_ID: bexley.testnet
      APP_ID: pool.bexley.testnet
      AGENT_ID: guardian.bexley.testnet
      POOL_ID: pool.bexley.testnet
      GUARDIAN_ID: guardian.bexley.testnet
      # The agent's limited key is derived from this; the agent itself
      # never uses the owner's full access.
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: agent
        run: npm ci
      - name: Test the decision logic
        working-directory: agent
        run: npm test
      - name: Set up the Guardian account
        if: inputs.mode == 'setup'
        working-directory: agent
        run: node setup.mjs
      - name: Run one agent tick
        if: inputs.mode != 'setup'
        working-directory: agent
        env:
          DRY_RUN: ${{ inputs.mode == 'dry-run' && '1' || '' }}
        run: |
          # Pass only the derived agent key to the tick, not the owner key.
          export AGENT_PRIVATE_KEY=$(node -e "import('./key.mjs').then(m=>console.log(m.deriveAgentKey(process.env.NEAR_PRIVATE_KEY).privateKey))")
          echo "::add-mask::$AGENT_PRIVATE_KEY"
          env -u NEAR_PRIVATE_KEY node run.mjs
