name: Voice-over
on:
  push:
    branches: [media]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
      - run: pip install -q "kokoro>=0.9.4" soundfile
      - run: python voice/make.py voice/lines.json "$(cat voice/voices.txt)" out
        env:
          SPEED: ${{ '1.0' }}
      - name: Save the audio to this branch
        run: |
          mkdir -p audio
          for f in out/*.wav; do ffmpeg -v error -y -i "$f" -b:a 160k "audio/$(basename "${f%.wav}").mp3"; done
          git config user.name "Bexley media"; git config user.email "media@bexley.invalid"
          git add audio && git commit -q -m "Voice audio" && git push -q
