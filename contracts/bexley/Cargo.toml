[package]
name = "bexley"
version = "0.1.0"
edition = "2021"
description = "Bexley pool: bxUSD stablecoin and xNEAR leveraged token from one pool of NEAR, with a Stability Pool, Steady vaults and exit orders."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }
uint = { version = "0.10.2", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
