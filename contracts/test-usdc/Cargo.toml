[package]
name = "test-usdc"
version = "0.1.0"
edition = "2021"
description = "Test USDC for Bexley on NEAR testnet. Free to mint, no real value."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
