[workspace]
resolver = "2"
members = ["contracts/test-usdc", "contracts/faucet-token", "contracts/xtoken", "contracts/bexley", "contracts/bexley-deals-v1"]

[workspace.dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
